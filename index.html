<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL BODEGÓN | Menú Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #121212; color: #fff; font-family: 'Roboto Condensed', sans-serif; overflow-x: hidden; }
        .text-bodegon { font-family: 'Oswald', sans-serif; color: #facc15; }
        .bg-pizarra { background-image: url('https://www.transparenttextures.com/patterns/black-chalk.png'); }
        .btn-yellow { background: #facc15; color: #000; font-weight: 900; text-transform: uppercase; border-radius: 9999px; }
        .active-tab { color: #facc15; border-bottom: 2px solid #facc15; }
        .card-menu { background: #1a1a1a; border-radius: 15px; overflow: hidden; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-pizarra min-h-screen p-4">
    <div id="app" v-cloak class="max-w-md mx-auto">
        
        <header class="flex justify-between items-center mb-4 pt-2">
            <button class="flex flex-col items-center">
                <div class="bg-zinc-800 p-2 rounded-lg border border-zinc-700">
                    <span class="text-xl">📅</span>
                </div>
                <span class="text-[9px] uppercase font-bold mt-1 text-zinc-400 leading-none">Menú<br>Diario</span>
            </button>

            <div class="text-center">
                <h1 class="text-bodegon text-4xl italic leading-none">EL BODEGÓN</h1>
            </div>

            <button class="flex flex-col items-center">
                <div class="relative">
                    <span class="text-2xl text-yellow-500">🛒</span>
                    <span class="absolute -top-1 -right-2 bg-white text-black text-[10px] font-black px-1.5 rounded-full">{{ carrito.length }}</span>
                </div>
                <span class="text-[9px] uppercase font-bold mt-1 text-zinc-400 leading-none">Carrito<br>{{ carrito.length }} items</span>
            </button>
        </header>

        <nav class="flex justify-between border-b border-zinc-800 mb-6 pb-2 overflow-x-auto no-scrollbar text-[11px] font-bold uppercase tracking-tighter">
            <button v-for="c in categorias" @click="catActual = c" :class="catActual === c ? 'active-tab' : 'text-zinc-500'" class="px-2 pb-1">{{ c }}</button>
        </nav>

        <section class="space-y-6">
            <div v-for="p in platosPrincipales" :key="p.id" class="flex gap-4 items-center">
                <div class="w-1/2">
                    <img :src="p.img" class="rounded-full shadow-2xl border-2 border-zinc-800 object-cover aspect-square">
                </div>
                <div class="w-1/2">
                    <h2 class="text-bodegon text-2xl uppercase leading-none">{{ p.nombre }}</h2>
                    <p class="text-[10px] text-zinc-400 italic mb-1">{{ p.desc }}</p>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-xl font-bold font-mono">${{ p.precio }}</span>
                        <button @click="agregar(p)" class="btn-yellow px-4 py-1.5 text-[10px]">Agregar al pedido</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-4 gap-2 mt-8">
            <div v-for="p in platosMini" :key="p.id" class="text-center">
                <img :src="p.img" class="w-full aspect-square object-cover rounded-xl mb-1 shadow-lg">
                <p class="text-[8px] font-black uppercase leading-tight h-6 flex items-center justify-center">{{ p.nombre }}</p>
                <button @click="agregar(p)" class="btn-yellow w-full py-1 text-[8px] mt-1">Agregar</button>
            </div>
        </section>

        <section class="mt-10">
            <h3 class="text-center font-black uppercase italic mb-4 tracking-widest">Sucursales:</h3>
            <div class="grid grid-cols-2 gap-3">
                <div v-for="s in sucursales" @click="sucursalSel = s" 
                     :class="sucursalSel.id === s.id ? 'bg-white text-black' : 'bg-zinc-900 text-zinc-400'"
                     class="p-3 rounded-2xl transition-all cursor-pointer">
                    <p class="text-[12px] font-black uppercase">{{ s.nombre }}</p>
                    <p class="text-[9px] font-bold">{{ s.dir }}</p>

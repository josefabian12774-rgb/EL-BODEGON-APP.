<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EL BODEGÓN | RÍO GRANDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            height: 100dvh; width: 100vw; margin: 0; padding: 0; 
            overflow: hidden; background: #000; color: white;
            font-family: 'Oswald', sans-serif;
        }
        
        .bg-bodegon {
            background-color: #121212;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://www.transparenttextures.com/patterns/black-chalk.png');
            background-size: cover; height: 100dvh; display: flex; flex-direction: column;
        }

        .font-marker { font-family: 'Permanent Marker', cursive; color: #facc15; }
        
        /* Animación Palpitar para Menú Diario */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }
        .pulse-menu { animation: heartbeat 2s infinite ease-in-out; }

        .btn-action { 
            background: #facc15; color: #000; font-weight: 900; 
            font-size: 11px; text-transform: uppercase; padding: 6px 0; 
            border-radius: 20px; width: 100%; text-align: center;
            box-shadow: 0 4px 0px #b48a04;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 0px #b48a04; }

        .img-main { height: 100px; width: 100px; border-radius: 50%; border: 4px solid #333; object-fit: cover; background: #222; }
        .img-grid { width: 100%; aspect-ratio: 1/1; border-radius: 12px; object-fit: cover; border: 1px solid #444; background: #222; }

        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-bodegon">
    <div id="app" v-cloak class="flex flex-col h-full p-4 pt-2">
        
        <header class="flex justify-between items-center h-[12%]">
            <div class="flex flex-col items-center">
                <div class="bg-zinc-900 border border-zinc-800 w-12 h-12 rounded-xl flex items-center justify-center text-xl shadow-lg pulse-menu">📅</div>
                <span class="text-[9px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Menú<br>Diario</span>
            </div>
            <div class="text-center">
                <h1 class="font-marker text-3xl italic tracking-tighter uppercase leading-none">EL BODEGÓN</h1>
                <p class="text-[8px] tracking-[0.4em] text-zinc-600 font-bold uppercase mt-1">Río Grande</p>
            </div>
            <div class="flex flex-col items-center">
                <div class="bg-zinc-900 border border-zinc-800 w-12 h-12 rounded-xl flex items-center justify-center relative shadow-lg text-yellow-500">
                    <span class="text-xl">🛒</span>
                    <span class="absolute -top-1 -right-1 bg-white text-black text-[10px] font-black px-1.5 rounded-full border border-black">{{ pedido.length }}</span>
                </div>
                <span class="text-[9px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Carrito<br>{{ pedido.length }} items</span>
            </div>
        </header>

        <nav class="flex justify-between border-b border-zinc-800 text-[11px] font-bold uppercase text-zinc-500 mt-2 h-[5%]">
            <button v-for="t in tabs" @click="tabActiva = t" :class="{'text-yellow-400 border-b-2 border-yellow-400': tabActiva === t}" class="pb-1 px-1">{{ t }}</button>
        </nav>

        <main class="flex flex-col justify-around py-2 h-[40%]">
            <div v-for="p in destacados" :key="p.id" class="flex items-center gap-4">
                <img :src="p.img" class="img-main">
                <div class="flex-1">
                    <h2 class="text-2xl italic text-yellow-400 uppercase leading-none">{{ p.nombre }}</h2>
                    <p class="text-[10px] text-zinc-400 italic leading-tight mb-2">{{ p.desc }}</p>
                    <div class="flex items-center justify-between">
                        <span class="text-2xl font-bold font-mono">$ {{ p.precio }}</span>
                        <button @click="agregar(p)" class="btn-action max-w-[100px]">Agregar</button>
                    </div>
                </div>
            </div>
        </main>

        <section class="grid grid-cols-4 gap-2 border-t border-zinc-800 pt-3 h-[18%]">
            <div v-for="p in mini" :key="p.id" class="flex flex-col">
                <img :src="p.img" class="img-grid mb-1">
                <p class="text-[7px] font-black uppercase text-center text-zinc-300 leading-none h-4 overflow-hidden mb-1">{{ p.nombre }}</p>
                <button @click="agregar(p)" class="btn-action text-[8px] py-1">Añadir</button>
            </div>
        </section>

        <footer class="flex flex-col justify-end gap-3 pb-2 h-[25%]">
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-white rounded-2xl p-2 text-black shadow-lg text-center">
                    <p class="text-[10px] font-black uppercase leading-none">SARMIENTO</p>
                    <p class="text-[8px] font-bold opacity-70 mb-1">Sarmiento 2307</p>
                    <p class="text-[10px] font-black">📞 40-4950</p>
                </div>
                <div class="bg-white rounded-2xl p-2 text-black shadow-lg text-center">
                    <p class="text-[10px] font-black uppercase leading-none">CABO PRIMERO</p>
                    <p class="text-[8px] font-bold opacity-70 mb-1">Gomez 2331</p>
                    <p class="text-[10px] font-black">📞 40-4952</p>
                </div>
            </div>
            <button @click="enviar" class="w-full bg-white text-black py-4 rounded-2xl font-black uppercase flex items-center justify-center gap-2 text-sm shadow-xl active:scale-95 transition-all">
                ENVIAR PEDIDO A DOMICILIO 🛵
            </button>
        </footer>

    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    tabActiva: 'ESPECIALIDADES',
                    tabs: ['INICIO', 'PROMOCIONES', 'ESPECIALIDADES', 'CONTACTO'],
                    pedido: [],
                    destacados: [
                        { id: 1, nombre: 'MILAGRUESA', desc: 'Milanesa gigante con papas fritas y huevos fritos.', precio: 7200, img: 'https://images.unsplash.com/photo-1599923262650-d7ce932b7058?q=80&w=400' },
                        { id: 2, nombre: 'LOMOSAURIO', desc: 'Lomo tierno, jamón, queso y huevo frito.', precio: 8500, img: 'https://images.unsplash.com/photo-1553979459-d2229ba7433b?q=80&w=400' }
                    ],
                    mini: [
                        { id: 3, nombre: 'EMPANADAS', img: 'https://images.unsplash.com/photo-1614088685112-0a760b71a3c8?q=80&w=200' },
                        { id: 4, nombre: 'HAMBURGUESA', img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=200' },
                        { id: 5, nombre: 'PAPAS FRITAS', img: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?q=80&w=200' },
                        { id: 6, nombre: 'PIZZAS', img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=200' }
                    ]
                }
            },
            methods: {
                agregar(p) { this.pedido.push(p); },
                enviar() {
                    if(this.pedido.length === 0) return alert("¡Elegí algo rico primero!");
                    alert("¡Pedido en camino! Items: " + this.pedido.length);
                }
            }
        }).mount('#app')
    </script>
</body>
</html>

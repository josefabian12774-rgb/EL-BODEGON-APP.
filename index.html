<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EL BODEGÓN | NEXO ARQUETIPO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            height: 100dvh; width: 100vw; margin: 0; padding: 0; 
            overflow: hidden; background: #000; color: white;
            font-family: 'Oswald', sans-serif;
        }
        .bg-bodegon {
            background-color: #121212;
            background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('https://www.transparenttextures.com/patterns/black-chalk.png');
            background-size: cover; height: 100dvh; display: flex; flex-direction: column;
        }
        .font-marker { font-family: 'Permanent Marker', cursive; color: #facc15; }
        
        /* NEXOSTATICAD: Ajuste de posición final */
        #nexo-static-ad {
            position: fixed;
            bottom: 20px; 
            right: 15px; 
            width: 25vw; /* Tamaño optimizado para el hueco */
            max-width: 100px;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(250, 204, 21, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
        }

        /* Contenedor de comandos (70% de ancho para dejar espacio al video) */
        .footer-controls {
            width: 72%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-sucursal {
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            flex: 1;
        }
        .btn-sucursal p { font-size: 9px; font-weight: 900; text-transform: uppercase; }

        .card-menu {
            background: #1a1a1a; border: 2px solid #333; border-radius: 20px;
            overflow: hidden; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-bodegon">
    <div id="app" v-cloak class="flex flex-col h-full p-4 pt-2">
        
        <div id="nexo-static-ad" @click="toggleAudio">
            <video id="adVideo" loop muted playsinline autoplay style="width: 100%; height: 100%; object-fit: cover;">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-a-futuristic-city-4416-large.mp4" type="video/mp4">
            </video>
            <div class="absolute top-1 left-1 text-[5px] bg-yellow-500 text-black px-1 rounded font-black uppercase">Nexo</div>
        </div>

        <header class="flex justify-between items-center h-[10%]">
            <div class="flex flex-col items-center">
                <div class="bg-zinc-900 border border-zinc-800 w-10 h-10 rounded-xl flex items-center justify-center text-lg">📅</div>
            </div>
            <div class="text-center">
                <h1 class="font-marker text-2xl italic tracking-tighter uppercase leading-none">EL BODEGÓN</h1>
            </div>
            <div class="flex flex-col items-center">
                <div class="bg-zinc-900 border border-zinc-800 w-10 h-10 rounded-xl flex items-center justify-center relative text-yellow-500">🛒</div>
            </div>
        </header>

        <nav class="flex justify-between border-b border-zinc-800 text-[10px] font-bold uppercase text-zinc-500 mt-2 h-[5%]">
            <button v-for="t in tabs" @click="tabActiva = t" :class="{'text-yellow-400 border-b-2 border-yellow-400': tabActiva === t}" class="pb-1 px-1">{{ t }}</button>
        </nav>

        <div class="flex-1 overflow-hidden mt-3">
            <div v-if="tabActiva === 'MENÚ DEL DÍA'" class="h-full flex flex-col items-center pt-2">
                <div class="card-menu">
                    <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?q=80&w=800" class="w-full h-44 object-cover">
                    <div class="p-4 bg-zinc-900/50 text-center">
                        <h2 class="font-marker text-2xl text-yellow-400 uppercase">Ravioles Caseros</h2>
                        <p class="text-white font-bold font-mono text-xl mt-1">$6.500</p>
                        <button class="w-full bg-[#facc15] text-black font-black py-2 rounded-lg mt-3 text-xs uppercase">Añadir al pedido</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="flex items-end pb-4 h-[25%]">
            <div class="footer-controls">
                <div class="flex gap-2">
                    <div @click="sucSel = 'SARMIENTO'" :class="sucSel === 'SARMIENTO' ? 'bg-yellow-400 text-black' : 'bg-white text-black'" class="btn-sucursal">
                        <p>SARMIENTO</p>
                        <p class="text-[8px] opacity-60">40-4950</p>
                    </div>
                    <div @click="sucSel = 'CABO'" :class="sucSel === 'CABO' ? 'bg-yellow-400 text-black' : 'bg-white text-black'" class="btn-sucursal">
                        <p>CABO 1°</p>
                        <p class="text-[8px] opacity-60">40-4952</p>
                    </div>
                </div>
                <button class="w-full bg-zinc-800 text-zinc-500 py-3 rounded-xl font-black uppercase text-[9px] border border-zinc-700">
                    CONSTRUYENDO NEXO...
                </button>
            </div>
            </footer>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    tabActiva: 'MENÚ DEL DÍA',
                    sucSel: null,
                    tabs: ['MENÚ DEL DÍA', 'PROMOCIONES', 'ESPECIALIDADES', 'CONTACTO']
                }
            },
            methods: {
                toggleAudio() {
                    const v = document.getElementById('adVideo');
                    v.muted = !v.muted;
                }
            },
            mounted() {
                setTimeout(() => {
                    document.getElementById('nexo-static-ad').style.display = 'block';
                }, 2000);
            }
        }).mount('#app')
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>EL BODEGÓN | Full View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Bloqueo total de scroll */
        html, body { 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            margin: 0; 
            padding: 0;
            background: #000;
            font-family: 'Roboto Condensed', sans-serif;
        }
        .text-yellow { color: #facc15; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        .bg-pizarra { background-image: url('https://www.transparenttextures.com/patterns/black-chalk.png'); }
        
        /* Contenedor que obliga a todo a entrar en el alto disponible */
        .app-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px 15px;
            box-sizing: border-box;
        }

        .header-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-dish-img {
            width: 110px; /* Ajustado para ganar espacio vertical */
            height: 110px;
            border-radius: 50%;
            border: 3px solid #222;
            object-fit: cover;
        }

        .mini-grid {
            display: grid;
            grid-template-cols: repeat(4, 1fr);
            gap: 8px;
        }
        .mini-grid img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
        }

        .btn-add {
            background: #facc15;
            color: #000;
            font-weight: 900;
            font-size: 9px;
            text-transform: uppercase;
            padding: 3px 0;
            border-radius: 20px;
            width: 100%;
        }

        [v-cloak] { display: none; }
    </style>
</head>

    <div id="app" v-cloak class="app-wrapper">
        
        <header class="flex justify-between items-start mb-2">
            <div class="flex flex-col items-center">

                <span class="text-[8px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Menú<br>Diario</span>
            </div>

                <button class="header-btn relative">
                    <span class="text-xl text-yellow-500">🛒</span>
                    <span class="absolute -top-1 -right-1 bg-white text-black text-[9px] font-black px-1 rounded-full border border-black">{{ carrito.length }}</span>
                </button>
                <span class="text-[8px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Carrito<br>{{ carrito.length }} Items</span>
            </div>
        </header>

        <nav class="flex justify-between border-b border-zinc-800 mb-4 pb-1 text-[10px] font-bold uppercase text-zinc-500 tracking-tighter">
            <button v-for="c in categorias" @click="catActual = c" :class="{'text-yellow border-b-2 border-yellow': catActual === c}" class="px-1">
                {{ c }}
            </button>
        </nav>

        <section class="flex-grow flex flex-col justify-around">
            <div v-for="p in platosPrincipales" :key="p.id" class="flex items-center gap-4">
                <div class="w-2/5 flex justify-center">
                    <img :src="p.img" class="main-dish-img">
                </div>
                <div class="w-3/5">
                    <h2 class="font-oswald text-2xl italic text-yellow uppercase leading-none">{{ p.nombre }}</h2>
                    <p class="text-[9px] text-zinc-400 italic leading-tight mt-0.5">{{ p.desc }}</p>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-lg font-bold font-mono">$ {{ p.precio }}</span>
                        <button @click="agregar(p)" class="btn-add max-w-[80px]">Agregar</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="mini-grid mt-4">
            <div v-for="p in platosMini" :key="p.id" class="flex flex-col items-center">
                <img :src="p.img">
                <p class="text-[7px] font-black uppercase text-center mt-1 leading-none h-4 overflow-hidden">{{ p.nombre }}</p>
                <button @click="agregar(p)" class="btn-add text-[7px] mt-0.5">Agregar</button>
            </div>
        </section>

        <footer class="mt-4">
            <div class="grid grid-cols-2 gap-2 mb-2">
                <button v-for="s in sucursales" @click="sucursalSel = s" 
                        :class="sucursalSel.id === s.id ? 'bg-white text-black shadow-lg shadow-white/10' : 'bg-zinc-900 text-zinc-500 border border-zinc-800'"
                        class="py-2 px-3 rounded-xl text-left transition-all">
                    <p class="text-[9px] font-black uppercase leading-none">{{ s.nombre }}</p>
                    <p class="text-[8px] font-bold opacity-70">{{ s.dir }}</p>
                </button>
            </div>
            
            <button @click="enviarWhatsApp" class="w-full bg-zinc-100 text-black py-3 rounded-xl font-black uppercase flex items-center justify-center gap-2 text-xs active:scale-95 transition-all">
                <span>ENVIAR PEDIDO A DOMICILIO</span>
                <span class="text-base">🛵</span>
            </button>
        </footer>

    </div>

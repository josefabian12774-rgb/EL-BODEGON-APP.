<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL BODEGÓN - Menú Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --amarillo: #ffcc00; --pizarra: #121212; }
        body {
            background-color: var(--pizarra);
            color: white;
            font-family: 'Montserrat', sans-serif;
            background-image: url('https://www.transparenttextures.com/patterns/black-chalkboard.png');
        }
        .font-titulo { font-family: 'Bebas Neue', cursive; }
        .header-bodegon { border-bottom: 4px dashed var(--amarillo); text-align: center; }
        .btn-sucursal { border: 2px solid #333; transition: 0.3s; background: #1a1a1a; }
        .btn-sucursal.active { border-color: var(--amarillo); background: rgba(255, 204, 0, 0.1); transform: scale(1.05); }
        .card-plato { background: #1a1a1a; border-radius: 15px; border-left: 5px solid var(--amarillo); overflow: hidden; }
        .btn-pedir { background-color: var(--amarillo); color: black; font-weight: 900; }
        .precio-tag { background: var(--amarillo); color: black; padding: 5px 12px; border-radius: 5px; font-weight: 900; }
    </style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto p-4 min-h-screen">
        
        <header class="header-bodegon py-6 mb-8">
            <h1 class="text-6xl font-titulo text-[#ffcc00]">EL BODEGÓN</h1>
            <p class="text-[10px] uppercase tracking-widest opacity-70">Sabor Casero • Río Grande</p>
        </header>

        <div class="mb-8">
            <h2 class="text-center font-titulo text-2xl mb-4 text-[#ffcc00]">1. Seleccioná tu sucursal</h2>
            <div class="grid grid-cols-2 gap-3">
                <button v-for="s in sucursales" :key="s.id" @click="sucursalSel = s"
                        :class="['btn-sucursal p-3 rounded-xl text-left', sucursalSel?.id === s.id ? 'active' : '']">
                    <p class="text-[10px] font-black text-zinc-500 uppercase">Sucursal</p>
                    <p class="font-bold text-sm">{{ s.nombre }}</p>
                </button>
            </div>
        </div>

        <div v-if="sucursalSel">
            <h2 class="text-center font-titulo text-3xl mb-6 italic text-[#ffcc00]">Nuestras Especialidades</h2>
            <div v-for="p in platos" :key="p.id" class="card-plato mb-6 shadow-xl">
                <div class="h-44 relative">
                    <img :src="p.img" class="w-full h-full object-cover">
                    <div class="absolute top-3 right-3 font-titulo text-2xl precio-tag">${{ p.precio }}</div>
                </div>
                <div class="p-4">
                    <h3 class="text-2xl font-titulo tracking-wide mb-1">{{ p.nombre }}</h3>
                    <p class="text-xs text-zinc-400 mb-4">{{ p.desc }}</p>
                    <button @click="enviarPedido(p)" class="btn-pedir w-full py-3 rounded-lg text-sm">PEDIR POR WHATSAPP</button>
                </div>
            </div>
        </div>

        <div v-else class="text-center py-20 opacity-30 font-titulo text-2xl uppercase">
            Seleccioná una sucursal para ver el menú
        </div>

    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    sucursalSel: null,
                    sucursales: [
                        { id: 1, nombre: 'SARMIENTO', tel: '5492964404950' },
                        { id: 2, nombre: 'CABO PRIMERO', tel: '5492964404952' }
                    ],
                    platos: [
                        { id: 1, nombre: 'LA MILAGRUESA', desc: 'Gigante y crocante para compartir.', precio: '4500', img: 'https://images.unsplash.com/photo-1632778149975-435f717f7c1e?w=500' },
                        { id: 2, nombre: 'LOMOSAURIO 🦖', desc: 'El rey de la isla con papas fritas.', precio: '5200', img: 'https://images.unsplash.com/photo-1550507992-eb63ffee0847?w=500' }
                    ]
                }
            },
            methods: {
                enviarPedido(p) {
                    const msg = encodeURIComponent(`¡Hola! Quiero pedir *${p.nombre}* desde la App.`);
                    window.open(`https://wa.me/${this.sucursalSel.tel}?text=${msg}`);
                }
            }
        }).mount('#app')
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO NAVE - El Bodegón Avanzado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0b0f19; 
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }

        /* Título Principal con Gradiente y Negrita Extrema (Cerca del original) */
        .nexo-title {
            font-weight: 900;
            background: linear-gradient(to right, #38bdf8, #1d4ed8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        /* Efecto Glassmorphism Profundo en las Tarjetas (Clave del parecido) */
        .nexo-card {
            background: rgba(23, 29, 41, 0.4);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nexo-card:active {
            transform: scale(0.97);
            box-shadow: 0 5px 10px -2px rgba(0, 0, 0, 0.4);
        }

        /* Color de Precio Específico */
        .price-tag {
            color: #38bdf8;
            font-weight: 700;
        }

        /* Icono de Carrito (Placeholder avanzado) */
        .cart-icon-bg {
            background: linear-gradient(135deg, rgba(29, 78, 216, 0.2), rgba(56, 189, 248, 0.05));
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 1rem;
        }

        /* Botón de WhatsApp con Sombra Profunda */
        .btn-whatsapp {
            background-color: #23c55e;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.5);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="p-6 pb-24 flex flex-col min-h-screen">
    
    <header class="text-center mb-10 pt-4">
        <h1 class="text-4xl md:text-5xl nexo-title">NEXO NAVE</h1>
        <p class="text-slate-400 text-sm mt-1 uppercase tracking-widest font-bold">Río Grande - Sistema de Pedidos</p>
    </header>

    <div class="flex-grow space-y-6 max-w-lg mx-auto w-full">
        <div class="nexo-card p-6 flex justify-between items-center gap-4">
            <div class="flex-1">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🦖</span>
                    <h3 class="text-2xl font-bold tracking-tight text-white">Lomosaurio</h3>
                </div>
                <p class="text-slate-400 text-sm mt-1">El más grande de Río Grande, tierno y abundante.</p>
                <p class="price-tag text-2xl mt-3">$8.500</p>
            </div>
            <button class="cart-icon-bg w-16 h-16 flex items-center justify-center active:scale-95 transition-transform">
                <span class="text-3xl text-sky-400">🛒</span>
            </button>
        </div>

        <div class="nexo-card p-6 flex justify-between items-center gap-4">
            <div class="flex-1">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🍳</span>
                    <h3 class="text-2xl font-bold tracking-tight text-white">Milagruesa</h3>
                </div>
                <p class="text-slate-400 text-sm mt-1">Gigante, con papas fritas doradas y dos huevos fritos.</p>
                <p class="price-tag text-2xl mt-3">$7.200</p>
            </div>
            <button class="cart-icon-bg w-16 h-16 flex items-center justify-center active:scale-95 transition-transform">
                <span class="text-3xl text-sky-400">🛒</span>
            </button>
        </div>
    </div>

    <div class="fixed bottom-6 left-6 right-6 max-w-lg mx-auto">
        <a href="https://wa.me/5492964000000" class="btn-whatsapp w-full py-5 rounded-full flex justify-center items-center text-xl text-white">
            PEDIR POR WHATSAPP
        </a>
    </div>

    <footer class="text-center py-10 text-slate-600 text-xs mt-10">
        Nexo Nave v2.0 - Río Grande, Tierra del Fuego
    </footer>

</body>
</html>

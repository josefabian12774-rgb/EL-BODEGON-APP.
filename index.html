<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Arquetipo - Nave Dynamic</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #121212;
      color: #ffffff;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .card {
      background: #2a2a2a;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <p>Cargando datos de la Nave...</p>
  </div>

  <script>
    // 1. Configuración de Credenciales Nexo
    const SUPABASE_URL = 'https://manaejtcurxbcsozqcsh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LTZY6uMVRCnd_K41dneBtw_xn3XU0ke';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Determinar Slug (Nave activa)
    const urlParams = new URLSearchParams(window.location.search);
    const naveSlug = urlParams.get('nave') || 'el-bodegon';

    async function cargarNave() {
      const appDiv = document.getElementById('app');

      // 3. Consultar SOLO la configuración publicada (Plano Público)
      const { data, error } = await supabaseClient
        .from('nexo_naves')
        .select('nombre, version, config_publicada')
        .eq('slug', naveSlug)
        .single();

      if (error || !data) {
        appDiv.innerHTML = `<h2>Error 404</h2><p>Nave '${naveSlug}' no encontrada o desvinculada.</p>`;
        return;
      }

      const config = data.config_publicada;
      const colorPrimario = config.apariencia?.color_primario || '#3b82f6';

      // 4. Renderizar UI
      let catalogoHtml = '';
      if (config.catalogo && config.catalogo.length > 0) {
        catalogoHtml = config.catalogo.map(prod => `
          <div class="card">
            <strong>${prod.nombre}</strong> - $${prod.precio}
          </div>
        `).join('');
      } else {
        catalogoHtml = '<p>No hay productos en el catálogo público.</p>';
      }

      appDiv.innerHTML = `
        <span class="badge" style="background-color: ${colorPrimario}; color: #000;">
          Versión: ${data.version}
        </span>
        <h1 style="color: ${colorPrimario};">${config.identidad?.nombre || data.nombre}</h1>
        <h3>Catálogo Registrado</h3>
        ${catalogoHtml}
      `;
    }

    cargarNave();
  </script>
</body>
</html>

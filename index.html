<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL BODEGÓN | App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Evitamos que el cuerpo sea negro total si hay error */
        html, body { 
            height: 100%; 
            margin: 0; 
            background: #121212; 
            overflow: hidden; 
            font-family: 'Roboto Condensed', sans-serif;
        }
        
        .text-yellow { color: #facc15; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        /* Contenedor principal con altura dinámica segura para móviles */
        .app-container {
            height: 100dvh; /* Dynamic Viewport Height */
            display: flex;
            flex-direction: column;
            padding: 10px;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://www.transparenttextures.com/patterns/black-chalk.png');
            background-color: #0a0a0a;
        }

        /* Botones de cabecera como en la Imagen Norte */
        .header-box {
            background: #1a1a1a;
            border: 1px solid #333;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ajuste de platos para que no empujen el resto */
        .dish-card {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1; /* Distribuye espacio */
            min-height: 0; 
        }
        .img-circle {
            height: 85%; /* Se adapta al contenedor */
            aspect-ratio: 1/1;
            border-radius: 50%;
            border: 2px solid #333;
            object-fit: cover;
        }

        /* Grilla inferior compacta */
        .mini-grid {
            display: grid;
            grid-template-cols: repeat(4, 1fr);
            gap: 6px;
            padding: 5px 0;
        }
        .mini-item img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
        }

        .btn-yellow {
            background: #facc15;
            color: #000;
            font-weight: 900;
            font-size: 9px;
            text-transform: uppercase;
            padding: 4px 0;
            border-radius: 15px;
            width: 100%;
        }

        [v-cloak] { display: none; }
    </style>
</head>
<body>
    <div id="app" v-cloak class="app-container">
        
        <header class="flex justify-between items-center mb-2">
            <div class="flex flex-col items-center">
                <div class="header-box"><span class="text-lg">📅</span></div>
                <span class="text-[7px] uppercase font-bold mt-1 text-zinc-500 leading-none text-center">Menú<br>Diario</span>
            </div>

            <div class="text-center">
                <h1 class="font-oswald text-2xl italic text-yellow leading-none uppercase">EL BODEGÓN</h1>
                <p class="text-[7px] tracking-widest text-zinc-400 font-bold mt-0.5">RÍO GRANDE</p>
            </div>

            <div class="flex flex-col items-center">
                <div class="header-box relative border-yellow-500/30">
                    <span class="text-lg text-yellow-500">🛒</span>
                    <span class="absolute -top-1 -right-1 bg-white text-black text-[8px] font-black px-1 rounded-full">{{ carrito.length }}</span>
                </div>
                <span class="text-[7px] uppercase font-bold mt-1 text-zinc-500 leading-none text-center">Carrito<br>{{ carrito.length }} Items</span>
            </div>
        </header>

        <nav class="flex justify-between border-b border-zinc-800 mb-2 pb-1 text-[9px] font-bold uppercase text-zinc-500">
            <button v-for="c in categorias" @click="catActual = c" :class="{'text-yellow border-b border-yellow': catActual === c}" class="px-1">{{ c }}</button>
        </nav>

        <div class="flex-grow flex flex-col justify-around py-1 min-height-0">
            <div v-for="p in platosPrincipales" :key="p.id" class="dish-card">
                <div class="h-full flex items-center">
                    <img :src="p.img" class="img-circle shadow-lg">
                </div>
                <div class="flex-1">
                    <h2 class="font-oswald text-xl italic text-yellow uppercase leading-none">{{ p.nombre }}</h2>
                    <p class="text-[8px] text-zinc-500 italic leading-tight mt-0.5">{{ p.desc }}</p>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-sm font-bold font-mono">$ {{ p.precio }}</span>
                        <button @click="agregar(p)" class="btn-yellow max-w-[70px]">Agregar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mini-grid">
            <div v-for="p in platosMini" :key="p.id" class="mini-item flex flex-col items-center">
                <img :src="p.img">
                <p class="text-[7px] font-black uppercase text-center mt-1 leading-none h-3 overflow-hidden text-zinc-300">{{ p.nombre }}</p>
                <button @click="agregar(p)" class="btn-yellow text-[7px] mt-0.5">Agregar</button>
            </div>
        </div>

        <div class="mt-2">
            <div class="grid grid-cols-2 gap-2 mb-2">
                <button v-for="s in sucursales" @click="sucursalSel = s" 
                        :class="sucursalSel.id === s.id ? 'bg-zinc-100 text-black shadow-md' : 'bg-zinc-900 text-zinc-500 border border-zinc-800'"
                        class="py-1.5 px-2 rounded-lg text-left transition-all">
                    <p class="text-[8px] font-black uppercase leading-none">{{ s.nombre }}</p>
                    <p class="text-[7px] font-bold opacity-60">{{ s.dir }}</p>
                </button>
            </div>
            
            <button @click="enviarWhatsApp" class="w-full bg-zinc-100 text-black py-2.5 rounded-lg font-black uppercase flex items-center justify-center gap-2 text-[10px] active:bg-yellow-400 transition-colors">
                <span>ENVIAR PEDIDO A DOMICILIO</span>
                <span class="text-sm">🛵</span>
            </button>
        </div>

    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    catActual: 'ESPECIALIDADES',
                    sucursalSel: { id: 1, nombre: 'SARMIENTO', dir: 'Sarmiento 2307', tel: '5492964404950' },
                    categorias: ['INICIO', 'PROMOCIONES', 'ESPECIALIDADES', 'CONTACTO'],
                    sucursales: [
                        { id: 1, nombre: 'SARMIENTO', dir: 'Sarmiento 2307', tel: '5492964404950' },
                        { id: 2, nombre: 'CABO 1RO', dir: 'Gomez 2331', tel: '5492964404952' }
                    ],
                    carrito: [],
                    platosPrincipales: [
                        { id: 1, nombre: 'MILAGRUESA', desc: 'Milanesa Gigante para compartir.', precio: 7200, img: 'https://images.unsplash.com/photo-1599923262650-d7ce932b7058?q=80&w=300' },
                        { id: 2, nombre: 'LOMOSAURIO', desc: 'Lomo premium completo.', precio: 8500, img: 'https://images.unsplash.com/photo-1553979459-d2229ba7433b?q=80&w=300' }
                    ],
                    platosMini: [
                        { id: 3, nombre: 'EMPANADAS', img: 'https://images.unsplash.com/photo-1614088685112-0a760b71a3c8?q=80&w=200' },
                        { id: 4, nombre: 'BURGER', img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=200' },
                        { id: 5, nombre: 'PAPAS', img: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?q=80&w=200' },
                        { id: 6, nombre: 'PIZZAS', img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=200' }
                    ]
                }
            },
            methods: {
                agregar(p) { this.carrito.push(p); },
                enviarWhatsApp() {
                    if (this.carrito.length === 0) return alert("Carrito vacío");
                    let msg = encodeURIComponent(`🍽️ *PEDIDO BODEGÓN*\n📍 Sucursal: ${this.sucursalSel.nombre}\nItems: ${this.carrito.length}`);
                    window.open(`https://wa.me/${this.sucursalSel.tel}?text=${msg}`);
                }
            }
        }).mount('#app')
    </script>
</body>
</html>

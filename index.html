<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EL BODEGÓN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            height: 100dvh; width: 100vw; margin: 0; padding: 0; 
            overflow: hidden; background: #000; color: white;
            font-family: 'Roboto Condensed', sans-serif;
        }
        .bg-pizarra {
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://www.transparenttextures.com/patterns/black-chalk.png');
            background-size: cover; height: 100dvh; display: flex; flex-direction: column;
        }
        .text-yellow { color: #facc15; }
        .font-oswald { font-family: 'Oswald', sans-serif; }

        /* HEADER FIJO */
        header { height: 12dvh; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .box-btn { 
            background: #1a1a1a; border: 1px solid #333; width: 50px; height: 50px; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
        }

        /* CUERPO FLEXIBLE PERO SIN SCROLL */
        main { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; padding: 0 15px; overflow: hidden; }
        
        .dish-row { display: flex; align-items: center; gap: 15px; height: 35%; }
        .img-circle { height: 80px; width: 80px; border-radius: 50%; border: 3px solid #222; object-fit: cover; flex-shrink: 0; }

        /* GRILLA 4 ICONOS */
        .icon-grid { display: grid; grid-template-cols: repeat(4, 1fr); gap: 8px; margin-top: 5px; }
        .icon-item img { width: 100%; aspect-ratio: 1/1; border-radius: 8px; object-fit: cover; border: 1px solid #333; }

        /* FOOTER FIJO */
        footer { height: 25dvh; padding: 10px 15px; display: flex; flex-direction: column; justify-content: flex-end; }
        
        .btn-yellow { 
            background: #facc15; color: #000; font-weight: 900; font-size: 10px; 
            text-transform: uppercase; padding: 5px 0; border-radius: 20px; width: 100%; 
        }
        .btn-branch { background: #1a1a1a; border: 1px solid #333; padding: 8px; border-radius: 10px; text-align: left; }
        .btn-branch.active { background: #fff; color: #000; }
    </style>
</head>
<body>
    <div id="app" v-cloak class="bg-pizarra">
        
        <header>
            <div class="flex flex-col items-center">
                <div class="box-btn text-xl">📅</div>
                <span class="text-[8px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Menú<br>Diario</span>
            </div>
            <div class="text-center">
                <h1 class="font-oswald text-3xl italic text-yellow leading-none uppercase tracking-tighter">EL BODEGÓN</h1>
                <p class="text-[7px] tracking-[0.3em] text-zinc-500 font-bold">RÍO GRANDE</p>
            </div>
            <div class="flex flex-col items-center">
                <div class="box-btn relative">
                    <span class="text-xl text-yellow-500">🛒</span>
                    <span class="absolute -top-1 -right-1 bg-white text-black text-[9px] font-black px-1.5 rounded-full border border-black">{{ carrito.length }}</span>
                </div>
                <span class="text-[8px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Carrito<br>{{ carrito.length }} items</span>
            </div>
        </header>

        <nav class="flex justify-between px-4 border-b border-zinc-800 text-[10px] font-bold uppercase text-zinc-500">
            <button v-for="c in categorias" @click="catActual = c" :class="{'text-yellow border-b-2 border-yellow': catActual === c}" class="pb-1">{{ c }}</button>
        </nav>

        <main>
            <div v-for="p in platosPrincipales" :key="p.id" class="dish-row">
                <img :src="p.img" class="img-circle">
                <div class="flex-1">
                    <h2 class="font-oswald text-2xl italic text-yellow uppercase leading-none">{{ p.nombre }}</h2>
                    <p class="text-[9px] text-zinc-400 italic leading-tight mt-1">{{ p.desc }}</p>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-lg font-bold font-mono">$ {{ p.precio }}</span>
                        <button @click="agregar(p)" class="btn-yellow max-w-[80px]">Agregar</button>
                    </div>
                </div>
            </div>

            <div class="icon-grid">
                <div v-for="p in platosMini" :key="p.id" class="icon-item flex flex-col items-center">
                    <img :src="p.img">
                    <p class="text-[7px] font-black uppercase text-center mt-1 leading-none text-zinc-300">{{ p.nombre }}</p>
                    <button @click="agregar(p)" class="btn-yellow text-[8px] mt-1 py-1">Añadir</button>
                </div>
            </div>
        </main>

        <footer>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <button v-for="s in sucursales" @click="sucursalSel = s" :class="sucursalSel.id === s.id ? 'active' : ''" class="btn-branch">
                    <p class="text-[9px] font-black uppercase leading-none">{{ s.nombre }}</p>
                    <p class="text-[8px] font-bold opacity-60">{{ s.dir }}</p>
                </button>
            </div>
            <button @click="enviarWhatsApp" class="w-full bg-zinc-100 text-black py-3.5 rounded-xl font-black uppercase text-xs flex items-center justify-center gap-2 mb-2">
                ENVIAR PEDIDO A DOMICILIO 🛵
            </button>
        </footer>

    </div>

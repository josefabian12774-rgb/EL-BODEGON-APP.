<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EL BODEGÓN | NEXO ARQUETIPO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            height: 100dvh; width: 100vw; margin: 0; padding: 0; 
            overflow: hidden; background: #000; color: white;
            font-family: 'Oswald', sans-serif;
        }
        .bg-bodegon {
            background-color: #121212;
            background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('https://www.transparenttextures.com/patterns/black-chalk.png');
            background-size: cover; height: 100dvh; display: flex; flex-direction: column;
        }
        .font-marker { font-family: 'Permanent Marker', cursive; color: #facc15; }
        
        /* NEXOSTATICAD: Módulo de video en carril derecho */
        #nexo-static-ad {
            position: fixed;
            bottom: 20px; 
            right: 12px; 
            width: 26vw;
            max-width: 95px;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(250, 204, 21, 0.4);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
        }

        .footer-controls { width: 68%; display: flex; flex-direction: column; gap: 8px; }

        .btn-sucursal {
            border-radius: 12px; padding: 12px 4px; text-align: center;
            transition: all 0.3s ease; cursor: pointer; flex: 1; border: 2px solid transparent;
        }
        .btn-sucursal p { font-size: 9px; font-weight: 900; text-transform: uppercase; line-height: 1; }

        .img-especialidad { height: 85px; width: 85px; border-radius: 14px; object-fit: cover; border: 1px solid #333; }
        
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-bodegon">
    <div id="app" v-cloak class="flex flex-col h-full p-4 pt-2">
        
        <div id="nexo-static-ad" @click="toggleAudio">
            <video id="adVideo" loop muted playsinline autoplay style="width: 100%; height: 100%; object-fit: cover;">
                <source src="73728bfbcc512462910cae2213cd896c.mp4" type="video/mp4">
            </video>
            <div class="absolute top-1 left-1 text-[5px] bg-yellow-500 text-black px-1 rounded font-black uppercase tracking-tighter">Nexo Ad</div>
        </div>

        <header class="flex justify-between items-center h-[10%]">
            <div class="bg-zinc-900/50 border border-zinc-800 w-10 h-10 rounded-xl flex items-center justify-center text-lg">📅</div>
            <div class="text-center">
                <h1 class="font-marker text-2xl italic tracking-tighter uppercase leading-none">EL BODEGÓN</h1>
                <p class="text-[7px] text-zinc-600 font-bold tracking-[0.3em] uppercase">Río Grande</p>
            </div>
            <div class="bg-zinc-900/50 border border-zinc-800 w-10 h-10 rounded-xl flex items-center justify-center relative text-yellow-500">
                🛒 <span class="absolute -top-1 -right-1 bg-white text-black text-[9px] font-black px-1 rounded-full">{{ pedido.length }}</span>
            </div>
        </header>

        <nav class="flex justify-between border-b border-zinc-800 text-[10px] font-bold uppercase text-zinc-500 mt-2 h-[5%]">
            <button v-for="t in tabs" @click="tabActiva = t" :class="{'text-yellow-400 border-b-2 border-yellow-400': tabActiva === t}" class="pb-1 px-1">{{ t }}</button>
        </nav>

        <div class="flex-1 overflow-y-auto mt-4 pr-1">
            
            <div v-if="tabActiva === 'MENÚ DEL DÍA'" class="flex flex-col items-center">
                <div class="bg-zinc-900/40 border border-zinc-800 rounded-[2rem] overflow-hidden w-full shadow-2xl">
                    <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?q=80&w=600" class="w-full h-44 object-cover">
                    <div class="p-5 text-center">
                        <h2 class="font-marker text-3xl text-yellow-400 uppercase leading-none">Ravioles Caseros</h2>
                        <p class="text-white font-bold font-mono text-2xl mt-2">$6.500</p>
                        <button @click="agregar({nombre:'Ravioles', precio:6500})" class="w-full bg-yellow-400 text-black font-black py-3 rounded-2xl mt-4 text-[10px] uppercase shadow-lg">Añadir</button>
                    </div>
                </div>
            </div>

            <div v-if="tabActiva === 'ESPECIALIDADES'" class="flex flex-col gap-3">
                <div v-for="p in platos" class="flex gap-4 items-center bg-zinc-900/30 border border-zinc-800/50 p-3 rounded-2xl">
                    <img :src="p.img" class="img-especialidad shadow-lg">
                    <div class="flex-1">
                        <h3 class="text-lg leading-none uppercase font-bold text-yellow-500">{{ p.nombre }}</h3>
                        <div class="flex justify-between items-center mt-2">
                            <span class="font-mono font-bold text-white">$ {{ p.precio }}</span>
                            <button @click="agregar(p)" class="bg-white text-black px-4 py-1.5 rounded-lg text-[9px] font-black uppercase">Añadir</button>
                        </div>
                    </div>
                </div>
            </div>

            <div v-if="tabActiva === 'CONTACTO'" class="flex flex-col items-center justify-center h-full text-center">
                <div class="bg-zinc-900/60 border border-zinc-800 p-8 rounded-[2.5rem] w-full">
                    <div class="flex justify-center gap-10 text-4xl mb-4">
                        <span>📸</span><span>📘</span><span>💬</span>
                    </div>
                    <p class="text-[8px] text-zinc-600 uppercase tracking-[0.4em] font-black">Rio Grande · TDF</p>
                </div>
            </div>
        </div>

        <footer class="flex items-end pb-4 h-[22%]">
            <div class="footer-controls">
                <div class="flex gap-2">
                    <div @click="sucSel = 'SARMIENTO'" :class="sucSel === 'SARMIENTO' ? 'bg-yellow-400 text-black border-white' : 'bg-white text-black border-transparent'" class="btn-sucursal border-2 shadow-md">
                        <p>SARMIENTO</p>
                    </div>
                    <div @click="sucSel = 'CABO'" :class="sucSel === 'CABO' ? 'bg-yellow-400 text-black border-white' : 'bg-white text-black border-transparent'" class="btn-sucursal border-2 shadow-md">
                        <p>CABO 1°</p>
                    </div>
                </div>
                <button class="w-full bg-zinc-900 border border-zinc-800 text-zinc-600 py-3.5 rounded-2xl font-black uppercase text-[9px] tracking-widest">
                    {{ sucSel ? 'PEDIR EN ' + sucSel : 'SELECCIONAR SUCURSAL' }}
                </button>
            </div>
        </footer>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    tabActiva: 'MENÚ DEL DÍA',
                    sucSel: null,
                    tabs: ['MENÚ DEL DÍA', 'ESPECIALIDADES', 'CONTACTO'],
                    pedido: [],
                    platos: [
                        { nombre: 'MILAGRUESA', precio: 7200, img: 'https://images.unsplash.com/photo-1594179200424-64448555e7bc?q=80&w=200' },
                        { nombre: 'LOMOSAURIO', precio: 8500, img: 'https://images.unsplash.com/photo-1553979459-d2229ba7433b?q=80&w=200' },
                        { nombre: 'EMPANADAS', precio: 5800, img: 'https://images.unsplash.com/photo-1628102476629-f81c107ce83d?q=80&w=200' }
                    ]
                }
            },
            methods: {
                agregar(p) { this.pedido.push(p); },
                toggleAudio() { document.getElementById('adVideo').muted = !document.getElementById('adVideo').muted; }
            },
            mounted() {
                setTimeout(() => { document.getElementById('nexo-static-ad').style.display = 'block'; }, 2000);
            }
        }).mount('#app')
    </script>
</body>
</html>

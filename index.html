<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Nave</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px;">

  <div id="app">
    <h1 id="titulo-nave">Cargando Nave...</h1>
    <div id="contenido-nave"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const naveId = urlParams.get('nave') || 'bodegon';

    if (naveId === 'barberia-urban-cut') {
      document.getElementById('titulo-nave').innerText = "BARBERÍA URBAN CUT";
      document.getElementById('contenido-nave').innerHTML = `
        <p style="color: #eab308;">Cortes Profesionales & Barbería</p>
        <div style="border: 1px solid #eab308; padding: 15px; margin: 10px; border-radius: 8px;">
          <h3>Corte Sombra / Fade</h3>
          <p>Precio: $8.000</p>
        </div>
      `;
    } else {
      document.getElementById('titulo-nave').innerText = "NEXO NAVE - BODEGÓN";
      document.getElementById('contenido-nave').innerHTML = `
        <p style="color: #eab308;">Menú del día</p>
        <div style="border: 1px solid #eab308; padding: 15px; margin: 10px; border-radius: 8px;">
          <h3>Ravioles Caseros</h3>
          <p>Precio: $6.500</p>
        </div>
      `;
    }
  </script>
</body>
</html>

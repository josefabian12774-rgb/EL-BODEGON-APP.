<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EL BODEGÓN | NEXO ARQUETIPO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            height: 100dvh; width: 100vw; margin: 0; padding: 0; 
            overflow: hidden; background: #000; color: white;
            font-family: 'Oswald', sans-serif;
        }
        .bg-bodegon {
            background-color: #121212;
            background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('https://www.transparenttextures.com/patterns/black-chalk.png');
            background-size: cover; height: 100dvh; display: flex; flex-direction: column;
        }
        .font-marker { font-family: 'Permanent Marker', cursive; color: #facc15; }
        
        /* NexoStaticAd: Módulo Publicitario Obligatorio */
        #nexo-static-ad {
            position: fixed;
            bottom: 85px; /* Por encima de las sucursales */
            left: 15px;
            width: 120px;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(250, 204, 21, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            z-index: 100;
            display: none; /* Se activa por JS */
            transition: all 0.5s ease;
        }
        @media (max-width: 480px) { #nexo-static-ad { width: 15vw; } }

        .btn-action { 
            background: #facc15; color: #000; font-weight: 900; 
            font-size: 11px; text-transform: uppercase; padding: 8px 0; 
            border-radius: 12px; width: 100%; text-align: center;
            box-shadow: 0 4px 0px #b48a04;
        }

        .card-menu {
            background: #1a1a1a; border: 2px solid #333; border-radius: 20px;
            overflow: hidden; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-bodegon">
    <div id="app" v-cloak class="flex flex-col h-full p-4 pt-2">
        
        <div id="nexo-static-ad" @click="toggleAudio">
            <video id="adVideo" loop muted playsinline autoplay style="width: 100%; height: 100%; object-fit: cover;">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-a-futuristic-city-4416-large.mp4" type="video/mp4">
            </video>
            <div class="absolute bottom-1 right-1 text-[6px] bg-black/50 px-1 rounded text-yellow-500 uppercase font-black">Nexo Ad</div>
        </div>

        <header class="flex justify-between items-center h-[12%]">
            <div class="flex flex-col items-center">
                <div class="bg-zinc-900 border border-zinc-800 w-11 h-11 rounded-xl flex items-center justify-center text-xl">📅</div>
                <span class="text-[8px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Menú<br>Diario</span>
            </div>
            <div class="text-center">
                <h1 class="font-marker text-3xl italic tracking-tighter uppercase leading-none">EL BODEGÓN</h1>
                <p class="text-[8px] tracking-[0.4em] text-zinc-600 font-bold uppercase mt-1">Río Grande</p>
            </div>
            <div class="flex flex-col items-center">
                <div class="bg-zinc-900 border border-zinc-800 w-11 h-11 rounded-xl flex items-center justify-center relative text-yellow-500">
                    <span class="text-xl">🛒</span>
                    <span class="absolute -top-1 -right-1 bg-white text-black text-[10px] font-black px-1.5 rounded-full">{{ pedido.length }}</span>
                </div>
                <span class="text-[8px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Carrito</span>
            </div>
        </header>

        <nav class="flex justify-between border-b border-zinc-800 text-[10px] font-bold uppercase text-zinc-500 mt-2 h-[5%]">
            <button v-for="t in tabs" @click="tabActiva = t" :class="{'text-yellow-400 border-b-2 border-yellow-400': tabActiva === t}" class="pb-1 px-1">{{ t }}</button>
        </nav>

        <div class="flex-1 overflow-hidden mt-3">
            <div v-if="tabActiva === 'MENÚ DEL DÍA'" class="h-full flex flex-col items-center justify-start pt-2">
                <div class="card-menu">
                    <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?q=80&w=800" class="w-full h-48 object-cover border-b-2 border-zinc-800">
                    <div class="p-4">
                        <div class="flex justify-between items-center">
                            <h2 class="font-marker text-3xl text-yellow-400 uppercase leading-none">Ravioles Caseros</h2>
                            <span class="text-2xl font-bold font-mono">$6.500</span>
                        </div>
                        <button @click="agregar({nombre:'Menú Ravioles', precio: 6500})" class="btn-action mt-4">Añadir al pedido</button>
                    </div>
                </div>
            </div>

            <div v-if="tabActiva === 'ESPECIALIDADES'" class="h-full flex flex-col justify-center items-center">
                <p class="text-zinc-500 font-marker text-2xl uppercase">Próximamente</p>
            </div>
        </div>

        <footer class="flex flex-col justify-end gap-3 pb-2 h-[25%] mt-2">
            <div class="grid grid-cols-2 gap-2">
                <div @click="sucSel = 'SARMIENTO'" :class="sucSel === 'SARMIENTO' ? 'bg-yellow-400 text-black border-2 border-white scale-105' : 'bg-white text-black'" class="rounded-2xl p-2 text-center transition-all">
                    <p class="text-[10px] font-black uppercase">SARMIENTO</p>
                    <p class="text-[10px] font-black">📞 40-4950</p>
                </div>
                <div @click="sucSel = 'CABO'" :class="sucSel === 'CABO' ? 'bg-yellow-400 text-black border-2 border-white scale-105' : 'bg-white text-black'" class="rounded-2xl p-2 text-center transition-all">
                    <p class="text-[10px] font-black uppercase">CABO PRIMERO</p>
                    <p class="text-[10px] font-black">📞 40-4952</p>
                </div>
            </div>
            <button class="w-full bg-zinc-800 text-zinc-500 py-3 rounded-2xl font-black uppercase text-xs border border-zinc-700">EN CONSTRUCCIÓN 🏗️</button>
        </footer>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    tabActiva: 'MENÚ DEL DÍA',
                    sucSel: null,
                    tabs: ['MENÚ DEL DÍA', 'PROMOCIONES', 'ESPECIALIDADES', 'CONTACTO'],
                    pedido: []
                }
            },
            methods: {
                agregar(p) { this.pedido.push(p); },
                toggleAudio(e) {
                    const v = document.getElementById('adVideo');
                    v.muted = !v.muted;
                }
            },
            mounted() {
                // Lógica NexoStaticAd: Carga diferida de 2 segundos
                setTimeout(() => {
                    document.getElementById('nexo-static-ad').style.display = 'block';
                }, 2000);
            }
        }).mount('#app')
    </script>
</body>
</html>

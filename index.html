<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL BODEGÓN - App Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #f1c40f; font-family: 'Special Elite', cursive; overflow-x: hidden; }
        .pizarra { background-image: url('https://www.transparenttextures.com/patterns/black-chalk.png'); }
        .btn-nexo { 
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid #f1c40f; 
            transition: all 0.2s;
            box-shadow: 4px 4px 0px #f1c40f;
        }
        .btn-nexo:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #f1c40f; background: #f1c40f; color: #000; }
        .btn-nexo.active { background: #f1c40f; color: #000; }
        
        .header-title { font-family: 'Permanent Marker', cursive; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="pizarra min-h-screen">
    <div id="app" v-cloak class="max-w-md mx-auto p-4 flex flex-col h-screen">
        
        <header class="text-center py-4">
            <h1 class="header-title text-4xl uppercase tracking-widest">EL BODEGÓN</h1>
            <div class="flex justify-center gap-2 mt-2">
                <span v-if="sucursalSel" class="text-[10px] bg-white text-black px-2 font-bold uppercase">📍 {{ sucursalSel.nombre }}</span>
                <span class="text-[10px] border border-yellow-500 px-2 uppercase">● SISTEMA ACTIVO</span>
            </div>
        </header>

        <div v-if="!sucursalSel" class="flex-grow flex flex-col justify-center gap-6">
            <h2 class="text-center italic">Seleccione Punto de Despegue:</h2>
            <button v-for="s in sucursales" @click="sucursalSel = s" class="btn-nexo py-8 text-2xl font-black uppercase">
                {{ s.nombre }}
            </button>
        </div>

        <div v-else class="flex-grow flex flex-col">
            <div class="flex gap-2 overflow-x-auto pb-4 no-scrollbar">
                <button v-for="cat in categorias" 
                        @click="catActual = cat"
                        :class="['btn-nexo px-4 py-2 text-[10px] whitespace-nowrap uppercase font-bold', catActual === cat ? 'active' : '']">
                    {{ cat }}
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4 overflow-y-auto">
                <button v-for="p in platosFiltrados" @click="agregar(p)" 
                        class="btn-nexo relative aspect-square overflow-hidden flex flex-col justify-end p-2">
                    <div class="absolute inset-0 bg-zinc-800 opacity-50 flex items-center justify-center text-4xl">🦖</div>
                    <span class="relative z-10 text-[10px] font-black uppercase leading-tight bg-black/80 p-1">{{ p.nombre }}</span>
                    <span class="relative z-10 text-xs font-bold text-white">${{ p.precio }}</span>
                </button>
            </div>
        </div>

        <footer v-if="carrito.length > 0" class="py-4">
            <button @click="enviarPedido" class="w-full bg-green-600 text-white p-5 rounded-xl font-black text-lg shadow-[0_5px_0_#15803d] active:shadow-none active:translate-y-1 transition-all">
                PEDIR COMANDO ({{ carrito.length }})
            </button>
            <button @click="carrito = []" class="w-full text-[10px] text-gray-500 mt-2 uppercase underline">Vaciar Carrito</button>
        </footer>

    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    sucursalSel: null,
                    catActual: 'LO MAS PEDIDO',
                    sucursales: [
                        { id: 1, nombre: 'SARMIENTO', tel: '5492964404950' },
                        { id: 2, nombre: 'CABO PRIMERO', tel: '5492964404952' }
                    ],
                    categorias: ['LO MAS PEDIDO', 'LOMOS', 'MILANESAS', 'BEBIDAS'],
                    platos: [
                        { id: 1, cat: 'LO MAS PEDIDO', nombre: 'LOMOSAURIO 🦖', precio: 8500 },
                        { id: 2, cat: 'LO MAS PEDIDO', nombre: 'LA MILAGRUESA 🍳', precio: 7200 },
                        { id: 3, cat: 'LOMOS', nombre: 'LOMO CLÁSICO', precio: 6000 },
                        { id: 4, cat: 'MILANESAS', nombre: 'MILA NAPO', precio: 5500 },
                        { id: 5, cat: 'BEBIDAS', nombre: 'COCA COLA 1.5L', precio: 2500 }
                    ],
                    carrito: []
                }
            },
            computed: {
                platosFiltrados() {
                    return this.platos.filter(p => p.cat === this.catActual);
                }
            },
            methods: {
                agregar(p) {
                    this.carrito.push(p);
                    // Efecto de sonido o feedback visual si querés después
                },
                enviarPedido() {
                    let lista = this.carrito.map(it => `🔹 *${it.nombre}*`).join('\n');
                    let msg = encodeURIComponent(`🚀 *NEXO BODEGÓN: NUEVO PEDIDO*\n📍 Sucursal: ${this.sucursalSel.nombre}\n\n${lista}\n\n✅ _Confirmar pedido vía WhatsApp_`);
                    window.open(`https://wa.me/${this.sucursalSel.tel}?text=${msg}`);
                }
            }
        }).mount('#app')
    </script>
</body>
</html>

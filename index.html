<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL BODEGÓN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #121212;
            background-image: url('https://www.transparenttextures.com/patterns/black-chalk.png'); /* Textura de tiza */
            font-family: 'Oswald', sans-serif;
            color: white; overflow-x: hidden;
        }
        .font-chalk { font-family: 'Permanent Marker', cursive; }
        .btn-bodegon {
            background: #facc15; color: black; font-weight: 900;
            border-radius: 999px; text-transform: uppercase;
            box-shadow: 0 4px 0 #b48a04; transition: all 0.1s;
        }
        .btn-bodegon:active { transform: translateY(2px); box-shadow: 0 2px 0 #b48a04; }
        .card-sucursal { background: #f3f4f6; color: black; border-radius: 1.5rem; }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

    <header class="flex justify-between items-center mb-6">
        <div class="text-center"><span class="text-2xl">📅</span><p class="text-[8px] font-bold">MENÚ DIARIO</p></div>
        <div class="text-center">
            <h1 class="font-chalk text-4xl text-yellow-400 leading-none">EL BODEGÓN</h1>
            <p class="text-[9px] tracking-[0.3em] text-zinc-500 font-bold">RÍO GRANDE</p>
        </div>
        <div class="text-center text-yellow-400">
            <span class="text-2xl">🛒</span>
            <p class="text-[8px] font-bold text-white">CARRITO<br>0 ITEMS</p>
        </div>
    </header>

    <div class="space-y-8 mb-8">
        <div class="flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1599923262650-d7ce932b7058?w=300" class="w-32 h-32 rounded-full border-4 border-zinc-800 object-cover">
            <div class="flex-1">
                <h2 class="text-3xl text-yellow-400 italic">MILAGRUESA</h2>
                <p class="text-xs text-zinc-400">Milanesa Gigante para compartir.</p>
                <div class="flex justify-between items-end mt-2">
                    <span class="text-2xl font-bold">$7.200</span>
                    <button class="btn-bodegon px-4 py-2 text-[10px]">AGREGAR AL PEDIDO</button>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=300" class="w-32 h-32 rounded-full border-4 border-zinc-800 object-cover">
            <div class="flex-1">
                <h2 class="text-3xl text-yellow-400 italic">LOMOSAURIO</h2>
                <p class="text-xs text-zinc-400">Sándwich de Lomo Premium completo.</p>
                <div class="flex justify-between items-end mt-2">
                    <span class="text-2xl font-bold">$8.500</span>
                    <button class="btn-bodegon px-4 py-2 text-[10px]">AGREGAR AL PEDIDO</button>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-4 gap-2 mb-8 border-t border-zinc-800 pt-4">
        <div class="text-center" v-for="i in ['EMPANADAS','BURGER','PAPAS','PIZZAS']">
            <div class="aspect-square bg-zinc-800 rounded-xl mb-1 overflow-hidden">
                <img src="https://via.placeholder.com/150" class="w-full h-full object-cover">
            </div>
            <p class="text-[7px] font-bold mb-1">{{i}}</p>
            <button class="btn-bodegon w-full py-1 text-[8px]">AGREGAR</button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="card-sucursal p-3 text-center">
            <p class="font-black text-xs">SARMIENTO</p>
            <p class="text-[9px]">Sarmiento 2307</p>
            <p class="font-bold text-[10px] mt-1">📞 2964 40-4950</p>
        </div>
        <div class="card-sucursal p-3 text-center">
            <p class="font-black text-xs">CABO PRIMERO</p>
            <p class="text-[9px]">Gomez 2331</p>
            <p class="font-bold text-[10px] mt-1">📞 2964 40-4952</p>
        </div>
    </div>

    <button class="w-full bg-white text-black font-black py-4 rounded-2xl flex items-center justify-center gap-2 mb-4">
        ENVÍOS A DOMICILIO 🛵
    </button>

</body>
</html>

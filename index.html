<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL BODEGÓN | App View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Bloqueo total de scroll para sentirlo como una App */
        html, body { 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            margin: 0; 
            background: #000;
            font-family: 'Roboto Condensed', sans-serif;
        }
        .text-yellow { color: #facc15; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        .bg-pizarra { 
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://www.transparenttextures.com/patterns/black-chalk.png');
            background-size: cover;
        }
        
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            justify-content: space-between;
        }

        /* Botones superiores tipo Imagen Norte */
        .header-box {
            background: #1a1a1a;
            border: 1px solid #333;
            width: 58px;
            height: 58px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Platos principales con imagen circular */
        .dish-row {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 22%; /* Proporción fija */
        }
        .img-circle {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 3px solid #222;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Grilla de 4 iconos inferior */
        .icon-grid {
            display: grid;
            grid-template-cols: repeat(4, 1fr);
            gap: 8px;
        }
        .icon-card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #333;
        }

        .btn-yellow {
            background: #facc15;
            color: #000;
            font-weight: 900;
            font-size: 10px;
            text-transform: uppercase;
            padding: 4px 0;
            border-radius: 20px;
            width: 100%;
            box-shadow: 0 2px 5px rgba(250, 204, 21, 0.2);
        }

        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-pizarra">
    <div id="app" v-cloak class="app-container">
        
        <header class="flex justify-between items-start">
            <div class="flex flex-col items-center">
                <div class="header-box"><span class="text-xl">📅</span></div>
                <span class="text-[8px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Menú<br>Diario</span>
            </div>

            <div class="text-center pt-2">
                <h1 class="font-oswald text-3xl italic text-yellow leading-none uppercase tracking-tighter">EL BODEGÓN</h1>
                <p class="text-[8px] tracking-[0.2em] text-zinc-400 font-bold">RÍO GRANDE</p>
            </div>

            <div class="flex flex-col items-center">
                <div class="header-box relative">
                    <span class="text-xl text-yellow-500">🛒</span>
                    <span class="absolute -top-1 -right-1 bg-white text-black text-[9px] font-black px-1.5 rounded-full">{{ carrito.length }}</span>
                </div>
                <span class="text-[8px] uppercase font-bold mt-1 text-zinc-500 text-center leading-none">Carrito<br>{{ carrito.length }} Items</span>
            </div>
        </header>

        <nav class="flex justify-between border-b border-zinc-800 pb-1 text-[10px] font-bold uppercase text-zinc-500">
            <button v-for="c in categorias" @click="catActual = c" :class="{'text-yellow border-b-2 border-yellow': catActual === c}" class="px-1">
                {{ c }}
            </button>
        </nav>

        <div class="flex flex-col gap-4">
            <div v-for="p in platosPrincipales" :key="p.id" class="dish-row">
                <div class="w-1/3 flex justify-center">
                    <img :src="p.img" class="img-circle">
                </div>
                <div class="w-2/3">
                    <h2 class="font-oswald text-2xl italic text-yellow uppercase leading-none">{{ p.nombre }}</h2>
                    <p class="text-[9px] text-zinc-400 italic leading-tight mt-1 line-clamp-2">{{ p.desc }}</p>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-lg font-bold font-mono">$ {{ p.precio }}</span>
                        <button @click="agregar(p)" class="btn-yellow max-w-[90px]">Agregar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="icon-grid">
            <div v-for="p in platosMini" :key="p.id" class="icon-card flex flex-col items-center">
                <img :src="p.img">
                <p class="text-[7px] font-black uppercase text-center mt-1 leading-none h-4 overflow-hidden">{{ p.nombre }}</p>
                <button @click="agregar(p)" class="btn-yellow text-[8px] mt-1">Agregar</button>
            </div>
        </div>

        <div class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <button v-for="s in sucursales" @click="sucursalSel = s" 
                        :class="sucursalSel.id === s.id ? 'bg-white text-black' : 'bg-zinc-900 text-zinc-500 border border-zinc-800'"
                        class="py-2 px-3 rounded-xl text-left transition-all">
                    <p class="text-[9px] font-black uppercase leading-none">{{ s.nombre }}</p>
                    <p class="text-[8px] font-bold opacity-60">{{ s.dir }}</p>
                </button>
            </div>
            
            <button @click="enviarWhatsApp" class="w-full bg-zinc-100 text-black py-3.5 rounded-xl font-black uppercase flex items-center justify-center gap-2 text-xs shadow-xl active:scale-95 transition-all">
                <span>ENVÍOS A DOMICILIO</span>
                <span class="text-base">🛵</span>
            </button>
        </div>

    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    catActual: 'ESPECIALIDADES',
                    sucursalSel: { id: 1, nombre: 'SARMIENTO', dir: 'Sarmiento 2307', tel: '5492964404950' },
                    categorias: ['INICIO', 'PROMOCIONES', 'ESPECIALIDADES', 'CONTACTO'],
                    sucursales: [
                        { id: 1, nombre: 'SARMIENTO', dir: 'Sarmiento 2307', tel: '5492964404950' },
                        { id: 2, nombre
